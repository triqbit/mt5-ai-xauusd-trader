services:
  trader-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mt5_trader_bot
    restart: unless-stopped
    volumes:
      - .env:/app/.env:ro
      - ./logs:/app/logs
    ports:
      - "8000:8000"  # Prometheus metrics
      - "8050:8050"  # Dash dashboard
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
