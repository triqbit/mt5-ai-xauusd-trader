services:
  trader:
    build:
      context: .
      dockerfile: Dockerfile
    image: triqbit/mt5-ai-xauusd-trader:latest
    container_name: xauusd-trader
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8050:8050"
    volumes:
      - .env:/app/.env:ro
      - ./logs:/app/logs
    environment:
      - MODE=${MODE:-demo}
      - ALGO=${ALGO:-ensemble}
    healthcheck:
      test: ["CMD", "python", "-c", "import src.core.config; print('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
