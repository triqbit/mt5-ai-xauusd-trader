version: '3.8'

services:
  trader:
    build:
      context: .
      dockerfile: Dockerfile
    image: triqbit/mt5-ai-xauusd-trader:latest
    container_name: mt5_trader
    restart: unless-stopped
    volumes:
      - .env:/app/.env:ro
      - ./logs:/app/logs
    ports:
      - "8000:8000"  # Prometheus metrics
      - "8050:8050"  # Dashboard (Dash)
    environment:
      - PYTHONUNBUFFERED=1
      - MODE=demo
      - ALGO=ensemble
    # Command can be overridden for different modes
    # command: ["--mode", "live", "--algo", "ensemble"]

