name: "🐞 Bug Report"
description: "Report a bug or unexpected behavior in the trading bot."
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "How can we replicate the issue? (e.g., specific symbol, mode, or config)"
      placeholder: |
        1. Set MODE=live
        2. Run with --symbol XAUUSD
        3. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logs and Tracebacks"
      description: "Please paste any relevant logs or error messages here."
  - type: input
    id: version
    attributes:
      label: "Version / Commit Hash"
      description: "Which version of the bot are you using?"
  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "OS, Python version, Docker vs Native, MT5 Broker, etc."
