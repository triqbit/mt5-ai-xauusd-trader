name: 🐛 Bug Report
description: Report a bug to help us improve the MT5 AI/ML Trading Bot
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Start the bot with `python main.py ...`
        2. Wait for...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Software versions, OS, MT5 version, etc.
      placeholder: |
        - OS: Windows 11 / Ubuntu 22.04
        - Python version: 3.11.5
        - MT5 Version: 5.0.4040
        - Bot Version: 1.0.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Please provide relevant logs if available.
      render: shell
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Verification
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I have verified that I am using the latest version of the bot.
          required: true
