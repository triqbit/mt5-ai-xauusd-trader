name: 🛡️ Security Report
description: Report a security vulnerability.
labels: ["security", "critical"]
body:
  - type: markdown
    attributes:
      value: |
        **WARNING:** Do not disclose security vulnerabilities in public issues.
        If this is a sensitive vulnerability, please contact the maintainers directly at [SECURITY_EMAIL_PLACEHOLDER].
  - type: textarea
    id: vulnerability-description
    attributes:
      label: Description of the vulnerability
      description: A clear and concise description of the security issue.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Potential Impact
      description: What could an attacker do with this vulnerability?
    validations:
      required: true
  - type: textarea
    id: remediation
    attributes:
      label: Suggested Remediation
      description: How do you suggest fixing this vulnerability?
