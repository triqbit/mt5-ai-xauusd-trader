name: Pre-Deployment Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-and-security:
    name: Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linting & Security Tools
        run: |
          pip install ruff==0.4.3 mypy==1.10.0 pip-audit==2.7.3

      - name: Ruff Check
        run: ruff check src/ main.py

      - name: Ruff Format Check
        run: ruff format --check src/ main.py

      - name: Mypy Check
        run: mypy src/ main.py --ignore-missing-imports

      - name: Dependency Security Audit
        run: pip-audit --requirement requirements-ci.txt

      - name: Secrets Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests-and-migrations:
    name: Tests, Migrations & Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache TA-Lib
        id: cache-talib
        uses: actions/cache@v5
        with:
          path: /usr/lib/libta_lib.*
          key: ${{ runner.os }}-talib-v0.6.4

      - name: Install TA-Lib C library
        if: steps.cache-talib.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential wget
          wget -q https://github.com/ta-lib/ta-lib/releases/download/v0.6.4/ta-lib-0.6.4-src.tar.gz
          tar -xzf ta-lib-0.6.4-src.tar.gz
          cd ta-lib-0.6.4
          ./configure --prefix=/usr
          make -j2
          sudo make install
          cd ..
          rm -rf ta-lib-0.6.4 ta-lib-0.6.4-src.tar.gz
          sudo ldconfig

      - name: Install Dependencies
        run: |
          pip install pytest pytest-cov
          pip install -r requirements-ci.txt

      - name: Run Tests with Coverage Gate
        run: |
          pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=80
        env:
          MT5_LOGIN: "0"
          MT5_PASSWORD: "test"
          MT5_SERVER: "test"
          MODE: "demo"

      - name: Validate Environment Config Template
        run: python scripts/validate_env.py

      - name: Database Migration Reversibility Check
        run: python scripts/verify_migrations.py

      - name: Check Release Notes Existence
        run: python scripts/check_release_notes.py

  docker-validation:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [quality-and-security, tests-and-migrations]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ github.repository_owner }}/mt5-ai-xauusd-trader:validation-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ github.repository_owner }}/mt5-ai-xauusd-trader:validation-${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
