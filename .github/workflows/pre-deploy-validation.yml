name: Pre-Deployment Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------
  # STAGE 1: Fast Fail - Quality, Secrets, Config, Release Notes
  # -----------------------------------------------------------
  fast-validation:
    name: Fast Validation (Quality, Secrets, Config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Validation Tools
        run: |
          pip install ruff==0.4.3 mypy==1.10.0 pip-audit==2.7.3
          # Core dependencies for type information
          pip install pydantic pydantic-settings sqlalchemy structlog

      - name: Ruff Lint & Format Check
        run: |
          echo "Running Ruff checks..."
          ruff check src/ main.py
          ruff format --check src/ main.py

      - name: Mypy Type Check
        run: |
          echo "Running Mypy static analysis..."
          mypy src/ main.py --ignore-missing-imports

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Environment Config Template
        run: |
          echo "Verifying .env.example matches src/core/config.py..."
          python scripts/validate_env.py

      - name: Validate Release Notes
        run: |
          echo "Checking CHANGELOG.md for [Unreleased] content..."
          python scripts/check_release_notes.py

      - name: Dependency Security Audit
        run: |
          echo "Scanning dependencies for vulnerabilities..."
          pip-audit --requirement requirements-ci.txt

  # -----------------------------------------------------------
  # STAGE 2: Functional - Migrations, Tests & Coverage
  # -----------------------------------------------------------
  functional-validation:
    name: Functional Validation (Tests & Migrations)
    runs-on: ubuntu-latest
    needs: fast-validation
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache TA-Lib
        id: cache-talib
        uses: actions/cache@v4
        with:
          path: /usr/lib/libta_lib.*
          key: ${{ runner.os }}-talib-v0.6.4

      - name: Install TA-Lib C library
        if: steps.cache-talib.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential wget
          wget -q https://github.com/ta-lib/ta-lib/releases/download/v0.6.4/ta-lib-0.6.4-src.tar.gz
          tar -xzf ta-lib-0.6.4-src.tar.gz
          cd ta-lib-0.6.4
          ./configure --prefix=/usr
          make -j2
          sudo make install
          cd ..
          rm -rf ta-lib-0.6.4 ta-lib-0.6.4-src.tar.gz
          sudo ldconfig

      - name: Install Dependencies
        run: |
          pip install pytest pytest-cov
          pip install -r requirements-ci.txt

      - name: Database Migration Reversibility Check
        run: |
          echo "Verifying database migrations (up/down/up cycle)..."
          python scripts/verify_migrations.py

      - name: Run Tests with Coverage Gate
        run: |
          echo "Running unit and integration tests..."
          pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=80
        env:
          MT5_LOGIN: "0"
          MT5_PASSWORD: "test"
          MT5_SERVER: "test"
          MODE: "demo"

  # -----------------------------------------------------------
  # STAGE 3: Artifact - Docker Build & Vulnerability Scan
  # -----------------------------------------------------------
  artifact-validation:
    name: Artifact Validation (Docker & Security)
    runs-on: ubuntu-latest
    needs: functional-validation
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ github.repository_owner }}/mt5-ai-xauusd-trader:validation-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ github.repository_owner }}/mt5-ai-xauusd-trader:validation-${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
