name: Release Orchestration

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0). If empty, will be calculated from commits.'
        required: false
      prerelease:
        description: 'Is this a pre-release?'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (do not tag or publish)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: read

jobs:
  # -----------------------------------------------------------
  # JOB 1: Validation - Quality, Security, Tests, Compliance
  # -----------------------------------------------------------
  validate:
    name: Release Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache TA-Lib
        id: cache-talib
        uses: actions/cache@v4
        with:
          path: /usr/lib/libta_lib.*
          key: ${{ runner.os }}-talib-v0.6.4

      - name: Install TA-Lib C library
        if: steps.cache-talib.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential wget
          wget -q https://github.com/ta-lib/ta-lib/releases/download/v0.6.4/ta-lib-0.6.4-src.tar.gz
          tar -xzf ta-lib-0.6.4-src.tar.gz
          cd ta-lib-0.6.4
          ./configure --prefix=/usr
          make -j2
          sudo make install
          cd ..
          rm -rf ta-lib-0.6.4 ta-lib-0.6.4-src.tar.gz
          sudo ldconfig

      - name: Install dependencies
        run: |
          pip install ruff==0.15.5 mypy==1.20.2 pip-audit==2.7.3 pip-licenses pytest==9.0.3 pytest-asyncio==1.3.0 pytest-cov==6.1.0
          pip install -r requirements-ci.txt

      - name: Ruff Check
        run: ruff check src/ main.py

      - name: Ruff Format Check
        run: ruff format --check src/ main.py

      - name: Mypy Check
        run: mypy src/ --ignore-missing-imports

      - name: Dependency Audit
        run: pip-audit --requirement requirements-ci.txt

      - name: License Compliance Check
        run: |
          pip-licenses --summary --fail-on GPL AGPL
          pip-licenses --format=markdown --output-file=docs/DEPENDENCY_LICENSES.md

      - name: Run Tests with Coverage Gate (85%)
        run: pytest tests/ --cov=src --cov-report=xml --cov-fail-under=85
        env:
          MT5_LOGIN: "0"
          MT5_PASSWORD: "test"
          MT5_SERVER: "test"
          MODE: "demo"

      - name: Validate Environment Config
        run: python scripts/validate_env.py

      - name: Migration Reversibility Check
        run: python scripts/verify_migrations.py

      - name: Validate Release Notes
        run: python scripts/check_release_notes.py

      - name: Automated Pre-Prod Checklist Verification
        run: |
          CHECKLIST="docs/PREPROD_CHECKLIST.md"
          if [ ! -f "$CHECKLIST" ]; then
            echo "::error::PREPROD_CHECKLIST.md missing!"
            exit 1
          fi

          # Fail if there are any unchecked boxes [ ]
          if grep -q "\[ \]" "$CHECKLIST"; then
            echo "::error::Uncompleted items found in PREPROD_CHECKLIST.md. Release blocked."
            grep -n "\[ \]" "$CHECKLIST"
            exit 1
          fi
          echo "Pre-prod checklist validation passed."

      - name: Upload Compliance Report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: docs/DEPENDENCY_LICENSES.md

  # -----------------------------------------------------------
  # JOB 2: Build - Docker Image and Security Scan
  # -----------------------------------------------------------
  build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v5

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.version }}" != "" ]]; then
              echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
              echo "TAG=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            else
              echo "VERSION=0.0.0-draft" >> $GITHUB_OUTPUT
              echo "TAG=v0.0.0-draft" >> $GITHUB_OUTPUT
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "TAG=$TAG" >> $GITHUB_OUTPUT
            echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: |
            triqbit/mt5-ai-xauusd-trader:${{ github.sha }}
            triqbit/mt5-ai-xauusd-trader:${{ steps.version.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: 'triqbit/mt5-ai-xauusd-trader:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # -----------------------------------------------------------
  # JOB 3: Release - Tags, Changelog, Artifacts, GitHub Release
  # -----------------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false') || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Calculate Next Version
        id: tag_action
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version == ''
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.version }}" != "" ]]; then
              echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
              echo "TAG=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            else
              echo "VERSION=${{ steps.tag_action.outputs.new_version }}" >> $GITHUB_OUTPUT
              echo "TAG=${{ steps.tag_action.outputs.new_tag }}" >> $GITHUB_OUTPUT
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "TAG=$TAG" >> $GITHUB_OUTPUT
            echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT
          fi

      - name: Update Version and Changelog
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false'
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          DATE=$(date +%Y-%m-%d)

          # Update pyproject.toml
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml

          # Update src/__init__.py if it exists
          if [ -f "src/__init__.py" ]; then
            sed -i "s/__version__ = \".*\"/__version__ = \"${VERSION}\"/" src/__init__.py
          fi

          # Transition [Unreleased] to Versioned in CHANGELOG.md
          if grep -q "## \[Unreleased\]" CHANGELOG.md; then
            sed -i "s/## \[Unreleased\]/## [Unreleased]\n\n## [${VERSION}] - ${DATE}/" CHANGELOG.md
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/__init__.py CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: release v${VERSION} [skip ci]"
            git push origin main
          fi

      - name: Create Git Tag (if manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false'
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Download Compliance Report
        uses: actions/download-artifact@v4
        with:
          name: compliance-report
          path: docs/

      - name: Package Release Artifacts
        run: |
          chmod +x scripts/package_release.sh
          VERSION="${{ steps.version.outputs.VERSION }}"
          export VERSION
          ./scripts/package_release.sh
          cd releases
          zip -r "mt5-ai-xauusd-trader-v${VERSION}.zip" "v${VERSION}"
          sha256sum "mt5-ai-xauusd-trader-v${VERSION}.zip" > "checksums.txt"
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Release ${{ steps.version.outputs.TAG }}
          body_path: releases/v${{ steps.version.outputs.VERSION }}/RELEASE_NOTES.md
          files: |
            releases/mt5-ai-xauusd-trader-v${{ steps.version.outputs.VERSION }}.zip
            releases/checksums.txt
            docs/DEPENDENCY_LICENSES.md
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
