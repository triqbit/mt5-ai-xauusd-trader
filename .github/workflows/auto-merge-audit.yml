name: Auto-Merge Audit

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  audit-log:
    name: Update Audit Log
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          separator: "|"
          base_sha: ${{ github.event.pull_request.base.sha }}
          sha: ${{ github.event.pull_request.head.sha }}

      - name: Update Audit Log
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Patterns must match auto-merge-policy.yml
          HIGH_RISK_PATTERNS=(
            "src/trading/executor.py"      # Live trading execution logic
            "src/core/risk_engine.py"      # Core risk engine
            "src/trading/risk_engine.py"   # Trading risk engine
            "src/trading/risk_manager.py"  # Risk parameters and sizing
            "config/secrets.*"             # Credentials and secrets
            ".github/workflows/deploy.*"   # Deployment workflows
            ".github/workflows/ci.yml"     # CI workflows affecting deployment
            "Dockerfile"                   # Infrastructure control
            "migrations/.*"                # Database migrations
          )

          TOUCHED_HIGH_RISK=false
          IFS="|" read -ra FILES <<< "${{ steps.changed-files.outputs.all_changed_files }}"
          for file in "${FILES[@]}"; do
            for pattern in "${HIGH_RISK_PATTERNS[@]}"; do
              if [[ "$file" =~ $pattern ]]; then
                TOUCHED_HIGH_RISK=true
                break 2
              fi
            done
          done

          # Check for labels as well to determine if it was an escalated review
          # Fetch PR labels using GH CLI
          LABELS=$(gh pr view $PR_NUMBER --json labels --template '{{range .labels}}{{.name}},{{end}}')

          if [[ "$LABELS" =~ "escalated-risk" ]]; then
            ACTION="Manual Review (Escalated)"
            REASON="High-risk files or policy violation"
          elif [ "$TOUCHED_HIGH_RISK" = "true" ]; then
             ACTION="Manual Review"
             REASON="High-risk files detected"
          else
            ACTION="Auto-Merged"
            REASON="Policy checks passed"
          fi

          DATE=$(date +'%Y-%m-%d')
          LOG_ENTRY="| $DATE | #$PR_NUMBER | $ACTION | $REASON | [PR]($PR_URL) |"

          # Use sed to insert the new log entry after the table header
          sed -i "/| :--- | :--- | :--- | :--- | :--- |/a $LOG_ENTRY" docs/integration/AUTO_MERGE_POLICY.md

          git config user.name "Jules05-Bot"
          git config user.email "jules05@users.noreply.github.com"
          git add docs/integration/AUTO_MERGE_POLICY.md
          git commit -m "🤖 Jules05: Update auto-merge audit log for PR #$PR_NUMBER"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
