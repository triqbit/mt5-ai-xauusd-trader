name: Auto-Merge Policy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [main]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  enforce-policy:
    name: Enforce Auto-Merge Policy
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    outputs:
      risk_status: ${{ steps.risk-check.outputs.risk_status }}
      compliance_status: ${{ steps.compliance-check.outputs.compliance_status }}
      observability_status: ${{ steps.observability-check.outputs.observability_status }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47

      - name: Check for High-Risk Files
        id: risk-check
        run: |
          # Patterns that strictly block and escalate
          HIGH_RISK_PATTERNS=(
            "src/trading/executor.py"      # Live trading execution logic
            "src/core/risk_engine.py"      # Core risk engine
            "src/trading/risk_engine.py"   # Trading risk engine
            "src/trading/risk_manager.py"  # Risk parameters and sizing
            "config/secrets.*"             # Credentials and secrets
            ".github/workflows/deploy.*"   # Deployment workflows
            ".github/workflows/ci.yml"     # CI workflows affecting deployment
            "Dockerfile"                   # Infrastructure control
            "migrations/.*"                # Database migrations
          )

          TOUCHED_HIGH_RISK=false
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            for pattern in "${HIGH_RISK_PATTERNS[@]}"; do
              if [[ "$file" =~ $pattern ]]; then
                echo "🚨 HIGH-RISK FILE DETECTED: $file"
                TOUCHED_HIGH_RISK=true
                break
              fi
            done
          done

          if [ "$TOUCHED_HIGH_RISK" = "true" ]; then
            echo "risk_status=blocked" >> $GITHUB_OUTPUT
            echo "::warning::High-risk files touched. Auto-merge is disabled and must be ESCALATED."
          else
            echo "risk_status=pass" >> $GITHUB_OUTPUT
            echo "✅ No high-risk files detected."
          fi

      - name: Check for Tests and Documentation
        id: compliance-check
        run: |
          HAS_TESTS=false
          HAS_DOCS=false
          SOURCE_MODIFIED=false
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ "$file" =~ ^tests/ ]]; then HAS_TESTS=true; fi
            if [[ "$file" =~ ^docs/ || "$file" =~ \.md$ ]]; then HAS_DOCS=true; fi
            if [[ "$file" =~ ^src/ || "$file" == "main.py" ]]; then SOURCE_MODIFIED=true; fi
          done

          VIOLATION=false
          if [ "$SOURCE_MODIFIED" = "true" ]; then
            if [ "$HAS_TESTS" = "false" ]; then
              echo "::warning::Source code modified but no tests added/updated."
              VIOLATION=true
            fi
            if [ "$HAS_DOCS" = "false" ]; then
              echo "::warning::Source code modified but no documentation updated."
              VIOLATION=true
            fi
          fi

          if [ "$VIOLATION" = "true" ]; then
            echo "compliance_status=fail" >> $GITHUB_OUTPUT
          else
            echo "compliance_status=pass" >> $GITHUB_OUTPUT
          fi

      - name: Check Observability Standards
        id: observability-check
        run: |
          # Incremental check for 'print(' statements in changed files
          VIOLATION=false
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ "$file" =~ ^src/.*\.py$ ]]; then
              if grep "print(" "$file"; then
                echo "::warning::Found 'print' statements in $file. Use 'structlog' instead."
                VIOLATION=true
              fi
            fi
          done

          if [ "$VIOLATION" = "true" ]; then
            echo "observability_status=fail" >> $GITHUB_OUTPUT
          else
            echo "observability_status=pass" >> $GITHUB_OUTPUT
          fi

      - name: Handle Violations
        if: |
          steps.risk-check.outputs.risk_status == 'blocked' ||
          steps.compliance-check.outputs.compliance_status == 'fail' ||
          steps.observability-check.outputs.observability_status == 'fail'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REASON="The following auto-merge criteria were not met:"
          FATAL_VIOLATION=false

          if [ "${{ steps.risk-check.outputs.risk_status }}" = "blocked" ]; then
            REASON="${REASON}\n- 🚨 **High-risk files modified.** (Must be ESCALATED and manually reviewed)"
            gh pr edit $PR_NUMBER --add-label "escalated-risk" || echo "Failed to add label"
          fi

          if [ "${{ steps.compliance-check.outputs.compliance_status }}" = "fail" ]; then
            REASON="${REASON}\n- ❌ **Missing required tests or documentation for source changes.**"
            FATAL_VIOLATION=true
          fi

          if [ "${{ steps.observability-check.outputs.observability_status }}" = "fail" ]; then
            REASON="${REASON}\n- ❌ **Observability standards not met (detected 'print' statements).**"
            FATAL_VIOLATION=true
          fi

          # Post comment with proper newlines
          echo -e "$REASON\n\nManual review by code owners is required. Changes to trading logic, risk parameters, or infrastructure are automatically escalated." > comment.txt
          gh pr comment $PR_NUMBER --body-file comment.txt

          # Explicitly disable auto-merge on the PR
          gh pr merge $PR_NUMBER --disable-auto || true

          if [ "$FATAL_VIOLATION" = "true" ]; then
            echo "::error::Policy compliance failure. Pull request requires corrections."
            exit 1
          fi

  enable-auto-merge:
    name: Enable Auto-Merge
    needs: enforce-policy
    runs-on: ubuntu-latest
    if: |
      success() &&
      needs.enforce-policy.outputs.risk_status == 'pass' &&
      needs.enforce-policy.outputs.compliance_status == 'pass' &&
      needs.enforce-policy.outputs.observability_status == 'pass'
    steps:
      - uses: actions/checkout@v5
      - name: Enable Auto-Merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # This enables GitHub's built-in auto-merge feature for this PR.
          # It will only merge once all other requirements (approvals, CI, conflicts) are met.
          # Note: CI now enforces 80% coverage via pytest-cov in ci.yml.
          gh pr merge $PR_NUMBER --auto --squash --delete-branch || echo "⚠️ Auto-merge could not be enabled. Skipping."
