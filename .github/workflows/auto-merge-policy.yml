name: Auto-Merge Policy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [main]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  enforce-policy:
    name: Enforce Auto-Merge Policy
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    outputs:
      risk_status: ${{ steps.risk-check.outputs.risk_status }}
      has_tests: ${{ steps.compliance-check.outputs.has_tests }}
      has_docs: ${{ steps.compliance-check.outputs.has_docs }}
      source_modified: ${{ steps.compliance-check.outputs.source_modified }}
      observability_pass: ${{ steps.observability-check.outputs.observability_pass }}
      approvals_pass: ${{ steps.approval-check.outputs.approvals_pass }}
      mergeable_pass: ${{ steps.mergeable-check.outputs.mergeable_pass }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47

      - name: Check for High-Risk Files
        id: risk-check
        run: |
          # Patterns that strictly block and escalate (using regex matching)
          HIGH_RISK_PATTERNS=(
            "^src/trading/executor.py"      # Live trading execution logic
            "^src/core/risk_engine.py"      # Risk parameters
            "^src/trading/risk_engine.py"   # Risk parameters
            "^src/trading/risk_manager.py"  # Risk parameters
            "^config/secrets.*"             # Credentials and secrets
            "^\.github/workflows/deploy.*"  # Deployment workflows
            "^\.github/workflows/ci.yml"    # CI/CD workflows affecting quality gates
            "^Dockerfile"                   # Infrastructure control
            "^docker-compose.yml"           # Infrastructure control
            "^migrations/"                  # Database migrations
          )

          TOUCHED_HIGH_RISK=false
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            for pattern in "${HIGH_RISK_PATTERNS[@]}"; do
              if [[ "$file" =~ $pattern ]]; then
                echo "🚨 HIGH-RISK FILE DETECTED: $file"
                TOUCHED_HIGH_RISK=true
              fi
            done
          done

          if [ "$TOUCHED_HIGH_RISK" = "true" ]; then
            echo "risk_status=blocked" >> $GITHUB_OUTPUT
            echo "::error::High-risk files touched. Auto-merge is strictly PROHIBITED and must be ESCALATED."
          else
            echo "risk_status=pass" >> $GITHUB_OUTPUT
            echo "✅ No high-risk files detected."
          fi

      - name: Check for Tests and Documentation
        id: compliance-check
        run: |
          HAS_TESTS=false
          HAS_DOCS=false
          SOURCE_MODIFIED=false
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ "$file" =~ ^tests/ ]]; then HAS_TESTS=true; fi
            if [[ "$file" =~ ^docs/ || "$file" =~ \.md$ ]]; then HAS_DOCS=true; fi
            if [[ "$file" =~ ^src/ || "$file" == "main.py" ]]; then SOURCE_MODIFIED=true; fi
          done

          echo "has_tests=$HAS_TESTS" >> $GITHUB_OUTPUT
          echo "has_docs=$HAS_DOCS" >> $GITHUB_OUTPUT
          echo "source_modified=$SOURCE_MODIFIED" >> $GITHUB_OUTPUT

      - name: Check Observability Standards
        id: observability-check
        run: |
          # Scan changed files in src/ for plain print statements (non-structlog/non-rich)
          BAD_LOGGING=false
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ "$file" =~ ^src/ ]]; then
              if grep -E "\bprint\(" "$file" | grep -v "console.print" > /dev/null; then
                echo "❌ OBSERVABILITY VIOLATION: Plain print statement found in $file"
                BAD_LOGGING=true
              fi
            fi
          done

          if [ "$BAD_LOGGING" = "true" ]; then
            echo "observability_pass=false" >> $GITHUB_OUTPUT
          else
            echo "observability_pass=true" >> $GITHUB_OUTPUT
          fi

      - name: Check Approvals and Mergeability
        id: approval-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Check for code owner approval via reviewDecision
          # reviewDecision is 'APPROVED' if all branch protection and code owner rules are satisfied.
          DECISION=$(gh pr view $PR_NUMBER --json reviewDecision -q '.reviewDecision')

          if [ "$DECISION" = "APPROVED" ]; then
            echo "approvals_pass=true" >> $GITHUB_OUTPUT
            echo "✅ Required approvals (including Code Owners) present."
          else
            echo "approvals_pass=false" >> $GITHUB_OUTPUT
            echo "❌ Required approvals missing or changes requested. (Decision: $DECISION)"
          fi

          # Check for merge conflicts
          MERGEABLE=$(gh pr view $PR_NUMBER --json mergeable -q '.mergeable')
          if [ "$MERGEABLE" = "MERGEABLE" ]; then
            echo "mergeable_pass=true" >> $GITHUB_OUTPUT
            echo "✅ No merge conflicts."
          else
            echo "mergeable_pass=false" >> $GITHUB_OUTPUT
            echo "❌ Merge conflicts detected."
          fi

      - name: Handle Violations
        if: |
          always() && (
            steps.risk-check.outputs.risk_status == 'blocked' ||
            (steps.compliance-check.outputs.source_modified == 'true' &&
             (steps.compliance-check.outputs.has_tests == 'false' || steps.compliance-check.outputs.has_docs == 'false')) ||
            steps.observability-check.outputs.observability_pass == 'false' ||
            steps.approval-check.outputs.approvals_pass == 'false' ||
            steps.approval-check.outputs.mergeable_pass == 'false'
          )
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REASON="The following auto-merge criteria were not met:"
          if [ "${{ steps.risk-check.outputs.risk_status }}" = "blocked" ]; then
            REASON="$REASON\n- 🚨 **High-risk files modified.** (Must be ESCALATED and manually reviewed)"
            gh pr edit $PR_NUMBER --add-label "escalated-risk" || echo "Failed to add label"
          fi
          if [ "${{ steps.observability-check.outputs.observability_pass }}" = "false" ]; then
            REASON="$REASON\n- ❌ **Observability standards not met (plain 'print' statements found).** Use \`structlog\` or Rich \`console.print\`."
          fi
          if [ "${{ steps.compliance-check.outputs.source_modified }}" = "true" ]; then
            if [ "${{ steps.compliance-check.outputs.has_tests }}" = "false" ]; then
              REASON="$REASON\n- ❌ **Source code modified but no tests added/updated.**"
            fi
            if [ "${{ steps.compliance-check.outputs.has_docs }}" = "false" ]; then
              REASON="$REASON\n- ❌ **Source code modified but no documentation updated.**"
            fi
          fi
          if [ "${{ steps.approval-check.outputs.approvals_pass }}" = "false" ]; then
            REASON="$REASON\n- ❌ **Missing required approvals from Code Owners.**"
          fi
          if [ "${{ steps.approval-check.outputs.mergeable_pass }}" = "false" ]; then
            REASON="$REASON\n- ❌ **Merge conflicts detected.**"
          fi

          gh pr comment $PR_NUMBER --body "### Auto-Merge Blocked\n$REASON\n\nManual review by code owners is required. Changes to trading logic, risk parameters, secrets, or infrastructure are automatically escalated."
          gh pr merge $PR_NUMBER --disable-auto || true
          exit 1

  enable-auto-merge:
    name: Enable Auto-Merge
    needs: enforce-policy
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v5
      - name: Enable Auto-Merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Final check: Ensure no checks have FAILED.
          # The 'gh pr merge --auto' command will handle the actual wait for success.
          FAILURES=$(gh pr view $PR_NUMBER --json statusCheckRollup -q '.statusCheckRollup[] | select(.conclusion == "FAILURE" or .state == "FAILURE") | .name // .context')

          if [ -n "$FAILURES" ]; then
            echo "❌ Cannot enable auto-merge. The following checks have FAILED:"
            echo "$FAILURES"
            exit 1
          fi

          gh pr merge $PR_NUMBER --auto --squash --delete-branch || echo "⚠️ Auto-merge could not be enabled yet."
