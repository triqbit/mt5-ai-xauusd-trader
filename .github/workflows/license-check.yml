name: "🗺️ Atlas: License Compliance Check"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-licenses

          # Install torch/torchvision from CPU index to save time/space
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

          # Create a unified requirements file for scanning, excluding TA-Lib which requires C libs
          cat requirements.txt requirements-ci.txt requirements-scan.txt | grep -v "TA-Lib" | sort | uniq > requirements-all-scan.txt

          # Install dependencies. MetaTrader5 is already platform-gated in requirements.txt
          pip install -r requirements-all-scan.txt || true

      - name: Run License Scan
        run: |
          # Enforce allowed licenses. Partial match covers variations.
          # We allow MIT, BSD, Apache, MPL, LGPL, PSF, Unlicense, and ISC.
          # UNKNOWN and Other/Proprietary are allowed for specific verified packages.
          # Explicitly blocking AGPL and CC-BY-NC via exclusion from allow-list.
          pip-licenses \
            --allow-only "MIT;BSD;Apache;MPL;LGPL;PSF;Unlicense;ISC;Other/Proprietary;UNKNOWN;Python" \
            --partial-match \
            --ignore-packages pip pip-licenses prettytable wcwidth setuptools

      - name: Generate Compliance Report
        run: |
          pip-licenses \
            --with-authors \
            --with-urls \
            --format=markdown \
            --output-file=DEPENDENCY_LICENSES.md \
            --ignore-packages pip pip-licenses prettytable wcwidth setuptools

      - name: Upload Compliance Report
        uses: actions/upload-artifact@v4
        with:
          name: license-compliance-report
          path: DEPENDENCY_LICENSES.md
