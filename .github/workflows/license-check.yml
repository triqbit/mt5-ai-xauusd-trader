name: "🗺️ Atlas: License Compliance Check"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-licenses

          # Install torch/torchvision from CPU index to save time/space
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

          # Create a unified requirements file for scanning, excluding TA-Lib and MetaTrader5 which are platform-specific
          cat requirements.txt requirements-ci.txt requirements-scan.txt | grep -vE "TA-Lib|MetaTrader5" | sort | uniq > requirements-all-scan.txt

          # Install dependencies for scanning
          pip install -r requirements-all-scan.txt || true

      - name: Run License Scan
        run: |
          # Enforce allowed licenses according to docs/LICENSE_COMPLIANCE.md
          # Explicitly ALLOWED: MIT, BSD, Apache, MPL, LGPL, PSF, Unlicense, ISC, Other/Proprietary, UNKNOWN (verified), Python.
          # Explicitly BLOCKED: GPL, AGPL, CC-BY-NC.
          # Note: We use --partial-match to handle variations like "MIT License" or "BSD-3-Clause".
          pip-licenses \
            --allow-only "MIT;BSD;Apache;MPL;LGPL;PSF;Unlicense;ISC;Other/Proprietary;UNKNOWN;Python" \
            --partial-match \
            --ignore-packages pip pip-licenses prettytable wcwidth setuptools

      - name: Generate Compliance Report
        run: |
          pip-licenses \
            --with-authors \
            --with-urls \
            --format=markdown \
            --output-file=docs/DEPENDENCY_LICENSES.md \
            --ignore-packages pip pip-licenses prettytable wcwidth setuptools

      - name: Upload Compliance Report
        uses: actions/upload-artifact@v4
        with:
          name: license-compliance-report
          path: docs/DEPENDENCY_LICENSES.md
