name: License Compliance Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  license-scan:
    name: Scan Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-licenses
          # Install CI dependencies to get a representative scan
          if [ -f requirements-ci.txt ]; then
            # Remove TA-Lib from requirements-ci.txt because it requires C library
            # and might fail if not pre-installed in the runner environment
            grep -v "TA-Lib" requirements-ci.txt > requirements-ci-scan.txt
            pip install -r requirements-ci-scan.txt
          fi

      - name: Generate License Report
        run: |
          mkdir -p docs
          pip-licenses --format=markdown --with-urls --output-file=docs/DEPENDENCY_LICENSES.md

      - name: Check for Disallowed Licenses
        run: |
          # Fails if GPL or AGPL is found in the dependency tree
          # Allowed: MIT, Apache, BSD, PSF, ISC, Unlicense, CC0
          # We check specifically for the strings "GPL" and "AGPL" while ignoring "LGPL"
          DISALLOWED=$(pip-licenses --format=plain | grep -v "LGPL" | grep -E "GPL|AGPL" || true)
          if [ ! -z "$DISALLOWED" ]; then
            echo "ERROR: Disallowed licenses detected!"
            echo "$DISALLOWED"
            exit 1
          else
            echo "License compliance check passed."
          fi

      - name: Upload License Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-license-report
          path: docs/DEPENDENCY_LICENSES.md
