name: Migration Safety

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Migration Reversibility & Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (No TA-Lib)
        run: |
          pip install -r requirements-ci-no-talib.txt

      - name: Run Migration Reversibility & Drift Check
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          python scripts/verify_migrations.py
