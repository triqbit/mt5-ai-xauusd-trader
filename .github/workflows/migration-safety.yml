name: Migration Safety

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Migration Reversibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install sqlalchemy==2.0.30 alembic==1.13.1 pydantic==2.13.3 pydantic-settings==2.14.0 numpy==2.2.6 structlog==25.5.0 pandas==3.0.2 scipy==1.17.1 psutil==7.2.2 python-telegram-bot==22.7

      - name: Run Migration Reversibility Check
        run: python scripts/verify_migrations.py
