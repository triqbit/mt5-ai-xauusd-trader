site_name: MT5 AI/ML Trading Bot
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - Troubleshooting: troubleshooting.md
  - API Reference:
      - Core: api/core.md
      - Trading: api/trading.md
      - Models: api/models.md
      - Environment: api/environment.md
