[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-ai-xauusd-trader"
version = "1.0.0"
description = "AI/ML Trading Bot for MetaTrader 5 - XAUUSD Gold Trading"
authors = [{name = "triqbit"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ===========================================================
# STEP 1 & 3: Ruff -- single tool for lint + format + import sorting
# Replaces: black, isort, flake8, pyupgrade
# ===========================================================
[tool.ruff]
line-length = 100
target-version = "py311"
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
# Enhanced rule sets (STEP 3):
# E/W = pycodestyle errors/warnings
# F = pyflakes (undefined names, unused imports)
# I = isort (import sorting -- enforced)
# N = pep8-naming
# B = flake8-bugbear (likely bugs and design issues)
# C4 = flake8-comprehensions (simplify comprehensions)
# SIM = flake8-simplify
# RUF = ruff-specific rules
#
# NOTE: UP (pyupgrade) excluded until typing.Dict/List/Optional migrated
select = ["E", "W", "F", "I", "N", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line-length -- handled by ruff format
    "B008",   # function calls in default args (FastAPI Depends pattern)
    "RUF012", # mutable class attrs -- false positives in pydantic models
    "SIM108", # ternary operator -- sometimes less readable
    "N803",   # argument name should be lowercase (ML conventions use X)
    "N806",   # variable in function should be lowercase (ML conventions)
    "N813",   # CamelCase imported as lowercase (MetaTrader5 as mt5 convention)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true
force-single-line = false
split-on-trailing-comma = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "B011"] # assert + raise-without-from OK in tests
"__init__.py" = ["F401"] # allow unused imports in __init__

# ===========================================================
# STEP 4: mypy -- strict type checking
# ===========================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

# ===========================================================
# STEP 5: pytest + coverage
# ===========================================================
[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
addopts = "--strict-markers --verbose --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=50"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
