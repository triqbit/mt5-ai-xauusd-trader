[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-ai-xauusd-trader"
version = "1.1.0"
description = "MT5 AI/ML Trading Bot - Enterprise Edition"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "triqbit"}]
dependencies = [
    "torch>=2.2.0",
    "stable-baselines3>=2.3.0",
    "gymnasium>=0.29.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "MetaTrader5>=5.0.45",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.7.0",
    "structlog>=24.1.0",
    "TA-Lib>=0.4.28",
    "python-telegram-bot>=21.0"
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = ["E501"] # line too long (handled by black)

[tool.ruff.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "setup.py"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/", "migrations/"]

[[tool.mypy.overrides]]
module = [
    "MetaTrader5.*",
    "talib.*",
    "pandas_ta.*",
    "sklearn.*",
    "scipy.*",
    "stable_baselines3.*",
    "gymnasium.*",
    "telegram.*"
]
ignore_missing_imports = true
