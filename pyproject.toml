[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-ai-xauusd-trader"
version = "1.0.0"
description = "AI/ML Trading Bot for MetaTrader 5 - XAUUSD Gold Trading"
authors = [{name = "triqbit"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ===========================================================
# Ruff — single tool for lint + format + import sorting
# Replaces: black, isort, flake8, pyupgrade
# ===========================================================
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# ruff format is the black-compatible formatter
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
# E/W = pycodestyle errors/warnings
# F   = pyflakes
# I   = isort (import sorting)
# UP  = pyupgrade (modernise syntax)
# B   = flake8-bugbear
# C4  = flake8-comprehensions
# SIM = flake8-simplify
# TCH = flake8-type-checking
# RUF = ruff-specific rules
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "TCH", "RUF"]
ignore = [
    "E501",   # line-length handled by formatter
    "B008",   # do not perform function calls in default args (FastAPI pattern)
    "TCH001", # TYPE_CHECKING block — allow direct imports for now
    "TCH002",
    "TCH003",
    "RUF012", # mutable class attrs — false positives in pydantic models
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true
force-single-line = false
split-on-trailing-comma = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert is fine in tests

# ===========================================================
# mypy
# ===========================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

# ===========================================================
# pytest
# ===========================================================
[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
addopts = "--strict-markers --verbose"
