[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-ai-xauusd-trader"
version = "1.0.0"
description = "AI/ML Trading Bot for MetaTrader 5 - XAUUSD Gold Trading"
authors = [{name = "triqbit"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ===========================================================
# Ruff — single tool for lint + format + import sorting
# Replaces: black, isort, flake8, pyupgrade
# ===========================================================
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# ruff format is the black-compatible formatter
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
# Rule sets enabled:
#   E/W = pycodestyle errors/warnings
#   F   = pyflakes (undefined names, unused imports)
#   I   = isort (import sorting — enforced)
#   B   = flake8-bugbear (likely bugs and design issues)
#   C4  = flake8-comprehensions (simplify comprehensions)
#   SIM = flake8-simplify
#   RUF = ruff-specific rules
#
# NOTE: UP (pyupgrade) intentionally excluded until source files
# are migrated from typing.Dict/List/Optional to built-in generics.
# Track in: https://github.com/triqbit/mt5-ai-xauusd-trader/issues
select = ["E", "W", "F", "I", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line-length — handled by ruff format
    "B008",   # function calls in default args (FastAPI Depends pattern)
    "RUF012", # mutable class attrs — false positives in pydantic models
    "SIM108", # ternary operator — sometimes less readable
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true
force-single-line = false
split-on-trailing-comma = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "B011"]   # assert + raise-without-from OK in tests

# ===========================================================
# mypy
# ===========================================================
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
# SQLAlchemy 2.0 and Pydantic v2 need special attention
# For now, we allow some slack to maintain CI stability
disable_error_code = ["attr-defined", "valid-type", "misc", "return-value", "assignment", "index"]

[[tool.mypy.overrides]]
module = [
    "MetaTrader5.*",
    "metaapi_cloud_sdk.*",
    "torch.*",
    "stable_baselines3.*",
    "gymnasium.*",
    "talib.*",
    "telegram.*",
    "pydantic.*",
    "pydantic_settings.*",
    "numpy.*",
    "sqlalchemy.*",
    "structlog.*"
]
ignore_missing_imports = true

# ===========================================================
# pytest
# ===========================================================
[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
addopts = "--strict-markers --verbose"
